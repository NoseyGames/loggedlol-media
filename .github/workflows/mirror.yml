name: Mirror preview media
on:
  workflow_dispatch:
  push:
    paths:
      - manifest.json
      - mirror.py
      - .github/workflows/mirror.yml
permissions:
  contents: write
concurrency:
  group: media-mirror
  cancel-in-progress: false
jobs:
  mirror:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Download and verify original assets
        run: python3 mirror.py
      - name: Commit verified assets
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Mirror checksum-verified Motion Library previews'
          git push
